name: profile

on:
  push:
    branches: [main]
    paths: [profile.toml, scripts/build_readme.py]
  schedule:
    - cron: "0 0 * * *"   # refresh the snake daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # only in the profile repo (repo name = username)
    if: github.repository == format('{0}/{0}', github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build README from profile.toml
        run: python3 scripts/build_readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update profile README" && git push)

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
